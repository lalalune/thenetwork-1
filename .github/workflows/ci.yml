{
  "name": "Formal archive priority test",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "seed": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Write complete",
          "shell": "bash",
          "run": "mkdir -p .spec-cache/formal\nprintf '%s\\n' complete > .spec-cache/formal/action-111111111111111111111111.json.gz"
        },
        {
          "name": "Cache complete",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "formal-full-complete-v2-probe-${{ github.run_id }}-regular-other-1"
          }
        },
        {
          "name": "Write checkpoint",
          "shell": "bash",
          "run": "mkdir -p .spec-cache/formal\nprintf '%s\\n' checkpoint > .spec-cache/formal/action-111111111111111111111111.json.gz"
        },
        {
          "name": "Cache checkpoint",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "formal-full-checkpoint-v2-probe-${{ github.run_id }}-regular-other-2"
          }
        },
        {
          "name": "Write checkpoint",
          "shell": "bash",
          "run": "mkdir -p .spec-cache/formal\nprintf '%s\\n' checkpoint > .spec-cache/formal/action-111111111111111111111111.json.gz"
        },
        {
          "name": "Cache checkpoint",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "formal-full-checkpoint-v2-probe-${{ github.run_id }}-regular-${{ github.run_id }}-1"
          }
        },
        {
          "name": "Write same-complete",
          "shell": "bash",
          "run": "mkdir -p .spec-cache/formal\nprintf '%s\\n' same-complete > .spec-cache/formal/action-111111111111111111111111.json.gz"
        },
        {
          "name": "Cache same-complete",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "formal-full-complete-v2-probe-${{ github.run_id }}-recent-${{ github.run_id }}-1"
          }
        },
        {
          "name": "Write same-checkpoint",
          "shell": "bash",
          "run": "mkdir -p .spec-cache/formal\nprintf '%s\\n' same-checkpoint > .spec-cache/formal/action-111111111111111111111111.json.gz"
        },
        {
          "name": "Cache same-checkpoint",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "formal-full-checkpoint-v2-probe-${{ github.run_id }}-recent-${{ github.run_id }}-9"
          }
        },
        {
          "name": "Write legacy",
          "shell": "bash",
          "run": "mkdir -p .spec-cache/formal\nprintf '%s\\n' legacy > .spec-cache/formal/action-111111111111111111111111.json.gz"
        },
        {
          "name": "Cache legacy",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "formal-full-actions-v1-probe-${{ github.run_id }}-legacy-other-1"
          }
        },
        {
          "name": "Write generation",
          "shell": "bash",
          "run": "mkdir -p .spec-cache/formal\nprintf '%s\\n' generation > .spec-cache/formal/action-111111111111111111111111.json.gz"
        },
        {
          "name": "Cache generation",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "formal-actions-v1-probe-${{ github.run_id }}-generation-synthetic"
          }
        }
      ]
    },
    "probe": {
      "runs-on": "ubuntu-latest",
      "name": "${{ matrix.name }}",
      "needs": "seed",
      "strategy": {
        "fail-fast": false,
        "max-parallel": 3,
        "matrix": {
          "include": [
            {
              "name": "prefer-complete",
              "group": "regular",
              "attempt": "1",
              "source": "complete",
              "changed": false,
              "fails": false,
              "cold": false,
              "save_complete": "skipped",
              "save_checkpoint": "skipped",
              "winner": "formal-complete"
            },
            {
              "name": "resume-checkpoint",
              "group": "regular",
              "attempt": "2",
              "source": "checkpoint",
              "changed": false,
              "fails": false,
              "cold": false,
              "save_complete": "success",
              "save_checkpoint": "skipped",
              "winner": "formal-retry"
            },
            {
              "name": "resume-own-complete",
              "group": "recent",
              "attempt": "2",
              "source": "same-complete",
              "changed": false,
              "fails": false,
              "cold": false,
              "save_complete": "skipped",
              "save_checkpoint": "skipped",
              "winner": "formal-retry"
            },
            {
              "name": "promote-legacy",
              "group": "legacy",
              "attempt": "1",
              "source": "legacy",
              "changed": false,
              "fails": false,
              "cold": false,
              "save_complete": "success",
              "save_checkpoint": "skipped",
              "winner": "formal-checkpoint"
            },
            {
              "name": "promote-generation",
              "group": "generation",
              "attempt": "1",
              "source": "generation",
              "changed": false,
              "fails": false,
              "cold": false,
              "save_complete": "success",
              "save_checkpoint": "skipped",
              "winner": "formal-generation"
            },
            {
              "name": "first-cold-success",
              "group": "new",
              "attempt": "1",
              "source": "empty",
              "changed": true,
              "fails": false,
              "cold": false,
              "save_complete": "success",
              "save_checkpoint": "skipped",
              "winner": "none"
            },
            {
              "name": "save-failed-partial",
              "group": "regular",
              "attempt": "3",
              "source": "checkpoint",
              "changed": true,
              "fails": true,
              "cold": false,
              "save_complete": "skipped",
              "save_checkpoint": "success",
              "winner": "formal-retry"
            },
            {
              "name": "failed-no-progress",
              "group": "recent",
              "attempt": "3",
              "source": "same-complete",
              "changed": false,
              "fails": true,
              "cold": false,
              "save_complete": "skipped",
              "save_checkpoint": "skipped",
              "winner": "formal-retry"
            },
            {
              "name": "explicit-cold",
              "group": "regular",
              "attempt": "4",
              "source": "empty",
              "changed": false,
              "fails": false,
              "cold": true,
              "save_complete": "skipped",
              "save_checkpoint": "skipped",
              "winner": "none"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Identify formal action archives",
          "id": "formal-keys",
          "shell": "bash",
          "env": {
            "TOOLS": "probe-${{ github.run_id }}-${{ matrix.group }}",
            "RESTORE": "${{ !matrix.cold }}"
          },
          "run": "printf '%s\\n' \"restore=$RESTORE\" \"complete=formal-full-complete-v2-$TOOLS-\" \\\n  \"checkpoint=formal-full-checkpoint-v2-$TOOLS-\" \"legacy=formal-full-actions-v1-$TOOLS-\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "name": "Restore a previous attempt of this full check",
          "id": "formal-retry",
          "if": "steps.formal-keys.outputs.restore == 'true' && matrix.attempt != '1'",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "${{ steps.formal-keys.outputs.complete }}${{ github.run_id }}-${{ matrix.attempt }}",
            "restore-keys": "${{ steps.formal-keys.outputs.complete }}${{ github.run_id }}-\n${{ steps.formal-keys.outputs.checkpoint }}${{ github.run_id }}-\n"
          }
        },
        {
          "name": "Restore actions from a successful full check",
          "id": "formal-complete",
          "if": "steps.formal-keys.outputs.restore == 'true' && !steps.formal-retry.outputs.cache-matched-key",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "${{ steps.formal-keys.outputs.complete }}${{ github.run_id }}-${{ matrix.attempt }}",
            "restore-keys": "${{ steps.formal-keys.outputs.complete }}"
          }
        },
        {
          "name": "Restore checkpoint or legacy formal actions",
          "id": "formal-checkpoint",
          "if": "steps.formal-keys.outputs.restore == 'true' && !steps.formal-retry.outputs.cache-matched-key && !steps.formal-complete.outputs.cache-matched-key",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "${{ steps.formal-keys.outputs.checkpoint }}${{ github.run_id }}-${{ matrix.attempt }}",
            "restore-keys": "${{ steps.formal-keys.outputs.checkpoint }}\n${{ steps.formal-keys.outputs.legacy }}\n"
          }
        },
        {
          "name": "Restore generation actions when no full-check archive exists",
          "if": "steps.formal-keys.outputs.restore == 'true' && !steps.formal-retry.outputs.cache-matched-key && !steps.formal-complete.outputs.cache-matched-key && !steps.formal-checkpoint.outputs.cache-matched-key",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "formal-actions-v1-probe-${{ github.run_id }}-${{ matrix.group }}-synthetic",
            "restore-keys": "formal-actions-v1-probe-${{ github.run_id }}-${{ matrix.group }}-"
          },
          "id": "formal-generation"
        },
        {
          "name": "Run the full Vibestack check",
          "id": "check",
          "shell": "bash",
          "run": "mkdir -p .spec-cache/formal\nfind .spec-cache/formal -maxdepth 1 -type f -name 'action-*.json.gz' -printf '%f\\n' |\n  sort > \"$RUNNER_TEMP/formal-actions-before\"\n\nfile=.spec-cache/formal/action-111111111111111111111111.json.gz\nif [[ -f \"$file\" ]]; then actual=$(cat \"$file\"); else actual=empty; fi\n[[ \"$actual\" == \"$EXPECTED\" ]]\nif [[ \"$CHANGED\" == true ]]; then\n  printf '%s\\n' additional > .spec-cache/formal/action-222222222222222222222222.json.gz\nfi\nif [[ \"$FAIL_CHECK\" == true ]]; then exit 73; fi\n",
          "continue-on-error": true,
          "env": {
            "EXPECTED": "${{ matrix.source }}",
            "CHANGED": "${{ matrix.changed }}",
            "FAIL_CHECK": "${{ matrix.fails }}"
          }
        },
        {
          "name": "Prepare completed actions for upload",
          "if": "${{ !cancelled() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') }}",
          "id": "ready",
          "shell": "bash",
          "run": "# The toolkit publishes complete raw actions by atomic rename in this directory.\nfind .spec-cache/formal -mindepth 1 -maxdepth 1 -regextype posix-extended \\\n  ! \\( -type f -regex '.*/action-[a-f0-9]{24}\\.json\\.gz' \\) -exec rm -rf -- {} +\nfind .spec-cache/formal -maxdepth 1 -type f -printf '%f\\n' |\n  sort > \"$RUNNER_TEMP/formal-actions-after\"\nif [[ -s \"$RUNNER_TEMP/formal-actions-after\" ]]; then\n  echo \"nonempty=true\" >> \"$GITHUB_OUTPUT\"\nfi\nif [[ -n \"$(comm -13 \"$RUNNER_TEMP/formal-actions-before\" \"$RUNNER_TEMP/formal-actions-after\")\" ]]; then\n  echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\n"
        },
        {
          "name": "Save actions from a successful full check",
          "if": "!cancelled() && steps.check.outcome == 'success' && steps.ready.outputs.nonempty == 'true' && (steps.ready.outputs.changed == 'true' || !startsWith(steps.formal-retry.outputs.cache-matched-key || steps.formal-complete.outputs.cache-matched-key, steps.formal-keys.outputs.complete))",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "${{ steps.formal-keys.outputs.complete }}${{ github.run_id }}-${{ matrix.attempt }}"
          },
          "id": "save-complete"
        },
        {
          "name": "Save progress from an unfinished full check",
          "if": "${{ !cancelled() && steps.check.outcome == 'failure' && steps.ready.outputs.changed == 'true' }}",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "${{ steps.formal-keys.outputs.checkpoint }}${{ github.run_id }}-${{ matrix.attempt }}"
          },
          "id": "save-checkpoint"
        },
        {
          "name": "Assert a single archive and expected saves",
          "shell": "bash",
          "env": {
            "EXPECT_COMPLETE": "${{ matrix.save_complete }}",
            "EXPECT_CHECKPOINT": "${{ matrix.save_checkpoint }}",
            "EXPECT_WINNER": "${{ matrix.winner }}",
            "EXPECT_FAILURE": "${{ matrix.fails }}",
            "FORMAL_RETRY": "${{ steps.formal-retry.outputs.cache-matched-key }}",
            "FORMAL_COMPLETE": "${{ steps.formal-complete.outputs.cache-matched-key }}",
            "FORMAL_CHECKPOINT": "${{ steps.formal-checkpoint.outputs.cache-matched-key }}",
            "FORMAL_GENERATION": "${{ steps.formal-generation.outputs.cache-matched-key }}",
            "CHECK": "${{ steps.check.outcome }}",
            "SAVE_COMPLETE": "${{ steps.save-complete.outcome }}",
            "SAVE_CHECKPOINT": "${{ steps.save-checkpoint.outcome }}"
          },
          "run": "\nwinners=()\n[[ -z \"$FORMAL_RETRY\" ]] || winners+=(formal-retry)\n[[ -z \"$FORMAL_COMPLETE\" ]] || winners+=(formal-complete)\n[[ -z \"$FORMAL_CHECKPOINT\" ]] || winners+=(formal-checkpoint)\n[[ -z \"$FORMAL_GENERATION\" ]] || winners+=(formal-generation)\nif [[ \"$EXPECT_WINNER\" == none ]]; then\n  [[ ${#winners[@]} == 0 ]]\nelse\n  [[ ${#winners[@]} == 1 && ${winners[0]} == \"$EXPECT_WINNER\" ]]\nfi\nif [[ \"$EXPECT_FAILURE\" == true ]]; then [[ \"$CHECK\" == failure ]]; else [[ \"$CHECK\" == success ]]; fi\n[[ \"$SAVE_COMPLETE\" == \"$EXPECT_COMPLETE\" && \"$SAVE_CHECKPOINT\" == \"$EXPECT_CHECKPOINT\" ]]\nprintf 'restore=%s complete=%s checkpoint=%s\\n' \"$EXPECT_WINNER\" \"$SAVE_COMPLETE\" \"$SAVE_CHECKPOINT\"\n"
        }
      ]
    }
  }
}
