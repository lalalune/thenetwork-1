name: Whole-flow Quint validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: corepack pnpm@10.24.0 --filter vibestack install --frozen-lockfile --ignore-scripts
        working-directory: tools/vibestack
      - name: Prepare the pinned Rust evaluator
        run: |
          pnpm run quint:check --tangle-only phone_identity
          tools/vibestack/node_modules/.bin/quint run runs/quint-models/phone_identity.qnt --backend rust --seed 0x5eed --max-steps 1 --max-samples 1 --invariant safety
      - name: Check all whole-flow models at their pinned bounds
        run: /usr/bin/time -p pnpm run quint:check --jobs 4
