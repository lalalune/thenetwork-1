{
  "name": "Formal peer manifest smoke",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "manifest": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": ".nvmrc"
          }
        },
        {
          "name": "Seed a complete marker receipt",
          "shell": "bash",
          "run": "mkdir -p .spec-cache/formal\nprintf '{\"synthetic\":true}' | gzip > .spec-cache/formal/action-111111111111111111111111.json.gz\ncat > scripts/precompute-formal-shard.ts <<'EOF'\nif (process.argv[4] === '--list') console.log(JSON.stringify({index:2,count:2,totalModels:2,modules:['fixture']}));\nEOF"
        },
        {
          "name": "Precompute the lighter formal shard after checking generated files",
          "id": "peer-bundle",
          "timeout-minutes": 16,
          "env": {
            "SEEDED": "formal-full-complete-v2-synthetic"
          },
          "shell": "bash",
          "run": "baseline=()\nif [[ -n \"$SEEDED\" ]]; then\n  before=\"$RUNNER_TEMP/formal-peer-before\"\n  find .spec-cache/formal -maxdepth 1 -type f -name 'action-*.json.gz' -printf '%f\\n' > \"$before\"\n  baseline=(\"$before\")\nfi\nnode scripts/precompute-formal-shard.ts 2 2\npython3 scripts/formal-shard-artifacts.py stage \"$RUNNER_TEMP/formal-shard\" \"${baseline[@]}\"\n"
        },
        {
          "name": "Check that the peer produced only the completion manifest",
          "shell": "bash",
          "run": "test -s \"$RUNNER_TEMP/formal-shard/manifest.json\"\ntest ! -e \"$RUNNER_TEMP/formal-shard/raw\""
        },
        {
          "name": "Upload formal actions for this attempt",
          "id": "peer-upload",
          "timeout-minutes": 2,
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "cold-formal-actions-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/formal-shard/",
            "compression-level": 0,
            "if-no-files-found": "error",
            "retention-days": 2
          }
        },
        {
          "name": "Download the matching generation formal receipts",
          "id": "download-shard",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "cold-formal-actions-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/formal-artifact"
          }
        },
        {
          "name": "Verify and restore the generation formal receipts",
          "run": "python3 scripts/formal-shard-artifacts.py restore \"$RUNNER_TEMP/formal-artifact\""
        },
        {
          "name": "Keep the preloaded receipt intact",
          "shell": "bash",
          "run": "test \"$(gzip -dc .spec-cache/formal/action-111111111111111111111111.json.gz)\" = '{\"synthetic\":true}'"
        }
      ]
    }
  }
}
