name: Container build benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Measure cold and source-only rebuilds
        shell: bash
        run: |
          for kind in backend backup; do
            git show "HEAD~2:deploy/$kind/Dockerfile" > "deploy/$kind/baseline.Dockerfile"
            cp "deploy/$kind/Dockerfile.dockerignore" "deploy/$kind/baseline.Dockerfile.dockerignore"
          done
          build() {
            local kind=$1 variant=$2 phase=$3 dockerfile=$4
            local log="$RUNNER_TEMP/$kind-$variant-$phase.log" start elapsed
            start="$(date +%s%N)"
            docker build --progress=plain -t "bench-$kind-$variant" -f "deploy/$kind/$dockerfile" . 2>&1 | tee "$log"
            elapsed="$(( ($(date +%s%N) - start) / 1000000 ))"
            echo "BENCH $kind $variant $phase milliseconds=$elapsed"
          }
          for kind in backend backup; do
            build "$kind" before cold baseline.Dockerfile
            build "$kind" after cold Dockerfile
          done
          printf '\n' >> packages/core/src/index.ts
          for kind in backend backup; do
            build "$kind" before source-only baseline.Dockerfile
            build "$kind" after source-only Dockerfile
            for variant in before after; do
              tag="bench-$kind-$variant"
              docker image inspect --format '{{json .Config}}' "$tag" > "$RUNNER_TEMP/$kind-$variant-config.json"
              docker run --rm --network none --entrypoint sh "$tag" -ec '
                node --import tsx --input-type=module -e "await import(\"./packages/core/src/index.ts\")"
                if [ -d /app/deploy/backend ]; then
                  test -s /app/packages/mcp/src/pages/generated/connector.css
                  node --import tsx --input-type=module -e "await import(\"./packages/engine/src/index.ts\")"
                else
                  pg_dump --version
                  node --import tsx --input-type=module -e "await import(\"./deploy/backup/backup.ts\")"
                fi
              '
              docker run --rm --network none --entrypoint sh "$tag" -ec '
                cd /app
                find . -type f ! -path "./node_modules/.modules.yaml" ! -path "./node_modules/.pnpm/lock.yaml" -print0 |
                  sort -z | xargs -0 sha256sum
              ' > "$RUNNER_TEMP/$kind-$variant-files.txt"
              docker image inspect --format "IMAGE $kind $variant {{.Size}}" "$tag"
            done
            diff -u "$RUNNER_TEMP/$kind-before-config.json" "$RUNNER_TEMP/$kind-after-config.json"
            diff -u "$RUNNER_TEMP/$kind-before-files.txt" "$RUNNER_TEMP/$kind-after-files.txt"
          done
