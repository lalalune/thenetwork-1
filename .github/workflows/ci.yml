name: Network formal acceptance
on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact approved legacy draft commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  full-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      REQUIRE_PG: "1"
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Bind verification to the approved source
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          [[ "$APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-list --parents -n 1 HEAD)" == "$GITHUB_SHA $APPROVED_SHA" ]]
          [[ "$(git diff --name-only "$APPROVED_SHA" HEAD)" == ".github/workflows/ci.yml" ]]
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1
        with:
          dafny-version: '4.11.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run spec:setup
      - name: Install the pinned Quint Rust evaluator
        working-directory: tools/vibestack
        shell: bash
        run: |
          version="$(node -p 'require("@informalsystems/quint/dist/src/rust/binaryManager.js").QUINT_EVALUATOR_VERSION')"
          test "$version" = v0.7.1
          directory="$(node -p 'require("@informalsystems/quint/dist/src/config.js").rustEvaluatorDir("v0.7.1")')"
          archive="$RUNNER_TEMP/quint-evaluator.tar.gz"
          curl --fail --silent --show-error --location --retry 4 \
            "https://github.com/quint-co/quint/releases/download/evaluator/$version/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' ce0502bdef65dc26c242a9e56379a9bb26de6f3db38f0e3989339d46a542f5eb "$archive" | sha256sum --check
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory" quint_evaluator
          test -x "$directory/quint_evaluator"
      - name: Require the synthetic Postgres service
        shell: bash
        run: |
          bin="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -x "$bin/pg_ctl"
          export PATH="$bin:$PATH"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/pg_isready" -h localhost -p 54339
          node --import tsx scripts/require-pg.ts
      - name: Run every formal verification stage
        shell: bash
        run: timeout --kill-after=20s 100m pnpm run accept
      - name: Verify and collect the approved ledger
        shell: bash
        env:
          APPROVED_SHA: ${{ inputs.approved_sha }}
        run: |
          git diff --exit-code -- . ':(exclude)spec/lock.json'
          [[ -z "$(git ls-files --others --exclude-standard)" ]]
          if git diff --quiet -- spec/lock.json; then
            echo 'Acceptance did not change the review ledger' >&2
            exit 1
          fi
          node --input-type=module -e 'import fs from "node:fs"; const lock = JSON.parse(fs.readFileSync("spec/lock.json", "utf8")); if (!lock.unproved || Object.keys(lock.unproved).length) throw new Error("The accepted lock contains proof exceptions");'
          mkdir -p "$RUNNER_TEMP/accepted"
          cp spec/lock.json "$RUNNER_TEMP/accepted/"
          printf '%s\n' "$APPROVED_SHA" > "$RUNNER_TEMP/accepted/source.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/accepted/qualification.txt"
          git diff --stat -- spec/lock.json
      - name: Retain approved ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-formal-ledger
          path: ${{ runner.temp }}/accepted/
          if-no-files-found: error
          retention-days: 2
