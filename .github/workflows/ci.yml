name: Qualify the pinned Dafny installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - &checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Dafny with the legacy helper
        uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31
        with:
          dafny-version: '4.11.0'
      - &node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - &typescript
        name: Install the existing verifier fingerprint dependencies
        shell: bash
        run: |
          npm install --global corepack@0.35.0
          corepack enable pnpm
          corepack pnpm@10.24.0 --dir tools/vibestack --filter vibestack install --frozen-lockfile --ignore-scripts
      - &fingerprint
        name: Measure the native verifier identity and verify both controls
        id: proof
        shell: bash
        run: |
          node --input-type=module <<'JS' | tee "$RUNNER_TEMP/dafny-identity"
          import { createHash } from 'node:crypto';
          import { verifierIdentity } from './tools/vibestack/vibestack/cache.ts';
          const identity = await verifierIdentity();
          console.log(createHash('sha256').update(identity).digest('hex'));
          console.log(identity);
          JS
          printf 'identity=%s\n' "$(head -1 "$RUNNER_TEMP/dafny-identity")" >> "$GITHUB_OUTPUT"
          solver="$(dirname "$(command -v dafny)")/z3/bin/z3-4.12.1"
          "$solver" --version
          cat > "$RUNNER_TEMP/valid.dfy" <<'DFY'
          lemma AddOne(n: int)
            ensures n + 1 > n
          {}
          DFY
          sed 's/n + 1 > n/n + 1 < n/' "$RUNNER_TEMP/valid.dfy" > "$RUNNER_TEMP/invalid.dfy"
          dafny verify --cores 1 --solver-path "$solver" "$RUNNER_TEMP/valid.dfy"
          if dafny verify --cores 1 --solver-path "$solver" "$RUNNER_TEMP/invalid.dfy" > "$RUNNER_TEMP/invalid.log" 2>&1; then
            echo 'The false obligation unexpectedly passed'
            exit 1
          fi
          cat "$RUNNER_TEMP/invalid.log"
          grep -F '1 error' "$RUNNER_TEMP/invalid.log"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { act } from './tools/vibestack/vibestack/action.ts';
          import { solver } from './tools/vibestack/vibestack/cache.ts';
          const root = process.env.RUNNER_TEMP;
          const solverPath = (await solver()).path;
          assert.equal(solverPath, `${process.env.RUNNER_TOOL_CACHE}/dafny/4.11.0/x64/z3/bin/z3-4.12.1`);
          const memory = { root, fresh: true, used: new Set() };
          const text = readFileSync(join(root, 'valid.dfy'), 'utf8');
          const result = await act(memory, 'dafny', ['verify', '--cores', '1', '--solver-path', solverPath, 'valid.dfy'], 'receipt', { 'valid.dfy': { text, key: text } });
          assert.ok(result.ok, result.out);
          const [key] = memory.used;
          assert.match(key, /^action-[a-f0-9]{24}\.json\.gz$/);
          console.log(`${key} ${solverPath}`);
          JS
  cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      identity: ${{ steps.proof.outputs.identity }}
    steps:
      - *checkout
      - *node
      - name: Install Dafny from the release
        id: dafny
        uses: ./.github/actions/setup-dafny
      - name: Check that the release was cold
        env:
          SOURCE: ${{ steps.dafny.outputs.source }}
        run: test "$SOURCE" = release
      - *typescript
      - *fingerprint
      - name: Force the observed direct HTTP 403 and verify the official API fallback
        shell: bash
        run: |
          test_root=$(mktemp -d)
          trap 'rm -rf -- "$test_root"' EXIT
          mkdir "$test_root/bin"
          cat > "$test_root/bin/curl" <<'SH'
          #!/usr/bin/env bash
          for arg; do
            if [[ "$arg" == https://github.com/dafny-lang/dafny/releases/download/* ]]; then
              echo 'Fixture: direct URL returned HTTP 403' >&2
              exit 22
            fi
          done
          exec /usr/bin/curl "$@"
          SH
          chmod +x "$test_root/bin/curl"
          ruby -ryaml -e 'puts YAML.safe_load_file(ARGV[0]).fetch("runs").fetch("steps").find { |s| s["id"] == "install" }.fetch("run")' .github/actions/setup-dafny/action.yml > "$test_root/install.sh"
          # A corrupt cached ZIP must not be extracted or mask the fallback.
          printf 'corrupt archive' > "$test_root/dafny-4.11.0-x64-ubuntu-22.04.zip"
          mkdir -p "$test_root/tool-cache/dafny/4.11.0/x64"
          touch "$test_root/tool-cache/dafny/4.11.0/x64/stale"
          PATH="$test_root/bin:$PATH" RUNNER_TEMP="$test_root" RUNNER_TOOL_CACHE="$test_root/tool-cache" GITHUB_PATH="$test_root/path" GITHUB_OUTPUT="$test_root/out" \
            RELEASE_FILE=dafny-4.11.0-x64-ubuntu-22.04.zip RELEASE_SHA=a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179 \
            bash -e -o pipefail "$test_root/install.sh"
          grep -Fx 'source=asset-api' "$test_root/out"
          verifier=$(cat "$test_root/path")
          test ! -e "$verifier/stale"
          "$verifier/dafny" verify --cores 1 --solver-path "$verifier/z3/bin/z3-4.12.1" "$RUNNER_TEMP/valid.dfy"
  warm:
    needs: cold
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - *node
      - name: Supply an unverified destination symlink and disable release downloads
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/no-curl" "$RUNNER_TEMP/untrusted-verifier"
          touch "$RUNNER_TEMP/untrusted-verifier/marker"
          mkdir -p "$RUNNER_TOOL_CACHE/dafny/4.11.0"
          ln -s "$RUNNER_TEMP/untrusted-verifier" "$RUNNER_TOOL_CACHE/dafny/4.11.0/x64"
          cat > "$RUNNER_TEMP/no-curl/curl" <<'SH'
          #!/usr/bin/env bash
          echo 'External download was attempted on the warm path' >&2
          exit 99
          SH
          chmod +x "$RUNNER_TEMP/no-curl/curl"
          echo "$RUNNER_TEMP/no-curl" >> "$GITHUB_PATH"
      - name: Install Dafny from the verified cache
        id: dafny
        uses: ./.github/actions/setup-dafny
      - name: Confirm that the verified cache supplied the archive
        env:
          SOURCE: ${{ steps.dafny.outputs.source }}
        shell: bash
        run: |
          test "$SOURCE" = cache
          test ! -L "$RUNNER_TOOL_CACHE/dafny/4.11.0/x64"
          test -f "$RUNNER_TEMP/untrusted-verifier/marker"
          test ! -e "$RUNNER_TEMP/untrusted-verifier/Dafny.dll"
      - *typescript
      - *fingerprint
      - name: Compare the content-keyed verifier identity
        env:
          WARM: ${{ steps.proof.outputs.identity }}
          COLD: ${{ needs.cold.outputs.identity }}
        run: test -n "$WARM" && test "$WARM" = "$COLD"
      - name: Refuse a symlinked tool-cache ancestor before extraction
        shell: bash
        run: |
          test_root=$(mktemp -d)
          trap 'rm -rf -- "$test_root"' EXIT
          mkdir "$test_root/redirect" "$test_root/cache"
          ln -s "$test_root/redirect" "$test_root/cache/dafny"
          ruby -ryaml -e 'puts YAML.safe_load_file(ARGV[0]).fetch("runs").fetch("steps").find { |s| s["id"] == "install" }.fetch("run")' .github/actions/setup-dafny/action.yml > "$test_root/install.sh"
          if RUNNER_TOOL_CACHE="$test_root/cache" GITHUB_PATH="$test_root/path" GITHUB_OUTPUT="$test_root/out" \
            RELEASE_FILE=dafny-4.11.0-x64-ubuntu-22.04.zip RELEASE_SHA=a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179 \
            bash -e -o pipefail "$test_root/install.sh"; then
            echo 'The alias was not rejected'
            exit 1
          fi
          test -z "$(find "$test_root/redirect" -mindepth 1 -print -quit)"
