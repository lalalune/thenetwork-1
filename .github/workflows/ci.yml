name: Integration worker benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Blank every provider key and leave LIVE_TESTS unset: live tests skip themselves.
  SURPLUS_API_KEY: ""
  OPENAI_API_KEY: ""
  BLOOIO_API_KEY: ""
  BLOOIO_LIVE_TEST: ""
  TWILIO_AUTH_TOKEN: ""
  TURNSTILE_SECRET_KEY: ""
  CLOUDFLARE_API_TOKEN: ""
  NTWRK_ALLOW_DEPLOY: ""
  LLM_ALLOW_OPENAI_FALLBACK: ""
  # Any accidental LLM call fails fast instead of hanging.
  LLM_TIMEOUT_MS: "10000"
  LLM_MAX_RETRIES: "0"

jobs:
  workers-2:
    # The integration suite (real Postgres, real HTTP servers, several packages together, the full
    # service; the security files are part of it: platform row-level security and composite keys, CSRF
    # and enumeration limits, MCP OAuth PKCE, the backend's "two logins" RLS check) and the e2e suite
    # (tests/e2e). Sends are dry-run and OTP providers are fakes: nothing leaves the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      # The dev Postgres port (54339). The test helpers create one database per test process.
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Postgres suites must run, not skip: the check step below fails the job without Postgres.
      REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - name: Put the Postgres client tools on PATH
        # The test helpers call initdb, pg_isready and pg_ctl (packages/observatory/db/dev-pg.ts).
        run: |
          bin="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -x "$bin/pg_ctl"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Record runner inputs
        run: |
          nproc
          free -m
          grep -m 1 "model name" /proc/cpuinfo
      - name: Initialize integration Postgres
        # Install cluster-wide roles once before workers migrate their separate databases.
        run: |
          pg_isready -h localhost -p 54339
          node --import tsx scripts/require-pg.ts
          node --import tsx packages/observatory/db/dev-pg.ts up
      - name: Integration suite (includes the security suite)
        run: |
          if [ -n "${LIVE_TESTS:-}" ]; then echo "LIVE_TESTS must be unset in CI"; exit 1; fi
          pnpm run test:integration
        timeout-minutes: 30
      - name: E2E suite (tests/e2e)
        run: |
          if [ -n "${LIVE_TESTS:-}" ]; then echo "LIVE_TESTS must be unset in CI"; exit 1; fi
          pnpm run test:e2e
        timeout-minutes: 10
  workers-4:
    # The integration suite (real Postgres, real HTTP servers, several packages together, the full
    # service; the security files are part of it: platform row-level security and composite keys, CSRF
    # and enumeration limits, MCP OAuth PKCE, the backend's "two logins" RLS check) and the e2e suite
    # (tests/e2e). Sends are dry-run and OTP providers are fakes: nothing leaves the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      # The dev Postgres port (54339). The test helpers create one database per test process.
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Postgres suites must run, not skip: the check step below fails the job without Postgres.
      REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - name: Put the Postgres client tools on PATH
        # The test helpers call initdb, pg_isready and pg_ctl (packages/observatory/db/dev-pg.ts).
        run: |
          bin="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -x "$bin/pg_ctl"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Record runner inputs
        run: |
          nproc
          free -m
          grep -m 1 "model name" /proc/cpuinfo
      - name: Initialize integration Postgres
        # Install cluster-wide roles once before workers migrate their separate databases.
        run: |
          pg_isready -h localhost -p 54339
          node --import tsx scripts/require-pg.ts
          node --import tsx packages/observatory/db/dev-pg.ts up
      - name: Integration suite (includes the security suite)
        run: |
          if [ -n "${LIVE_TESTS:-}" ]; then echo "LIVE_TESTS must be unset in CI"; exit 1; fi
          pnpm run test:integration --maxWorkers=4
        timeout-minutes: 30
      - name: E2E suite (tests/e2e)
        run: |
          if [ -n "${LIVE_TESTS:-}" ]; then echo "LIVE_TESTS must be unset in CI"; exit 1; fi
          pnpm run test:e2e --maxWorkers=4
        timeout-minutes: 10
