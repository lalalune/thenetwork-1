name: Workflow setup benchmark
on: workflow_dispatch
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    name: browser (${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run spec:setup
      - name: Original pinned Chromium setup
        if: matrix.variant == 'baseline'
        run: pnpm --dir tools/vibestack exec playwright install --with-deps --no-shell chromium
      - name: Install pinned Chromium for Bombadil
        if: matrix.variant == 'candidate'
        working-directory: tools/vibestack
        shell: bash
        run: |
          pnpm exec playwright install --no-shell chromium
          launch() {
            node --input-type=module -e '
              import { chromium } from "playwright";
              const browser = await chromium.launch({ executablePath: chromium.executablePath(), timeout: 10000 });
              await browser.close();
            '
          }
          if ! launch; then
            pnpm exec playwright install-deps chromium
            launch
          fi
      - run: pnpm run spec:explore
