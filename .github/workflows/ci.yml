name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg-fixture-benchmark:
    if: github.repository == 'lalalune/thenetwork-1' && startsWith(github.ref, 'refs/heads/codex/pg-fixture-benchmark-')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REQUIRE_PG: '1'
      SURPLUS_API_KEY: ''
      OPENAI_API_KEY: ''
      BLOOIO_API_KEY: ''
      BLOOIO_LIVE_TEST: ''
      TWILIO_AUTH_TOKEN: ''
      TURNSTILE_SECRET_KEY: ''
      CLOUDFLARE_API_TOKEN: ''
      NTWRK_ALLOW_DEPLOY: ''
      LLM_ALLOW_OPENAI_FALLBACK: ''
      LLM_TIMEOUT_MS: '10000'
      LLM_MAX_RETRIES: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - name: Put the Postgres client tools on PATH
        run: |
          bin="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -x "$bin/pg_ctl"
          echo "$bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Prepare the workspace and its isolated service database
        run: |
          test -z "${LIVE_TESTS:-}"
          pg_isready -h localhost -p 54339
          psql -h localhost -p 54339 -U runner -d postgres -Atc 'show server_version'
          node --import tsx scripts/require-pg.ts
          node --import tsx packages/observatory/db/dev-pg.ts up
          pnpm run connector:css
      - name: Repeated schema resets versus migrated template clones
        run: python3 scripts/pg-fixture-benchmark.py
