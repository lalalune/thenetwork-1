name: Dependency store benchmark
on: workflow_dispatch
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - id: store
        run: printf 'path=%s\n' "$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Populate both projects
        run: |
          pnpm install --frozen-lockfile
          pnpm run spec:setup
          du -sh "${{ steps.store.outputs.path }}"
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-benchmark-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
  verify:
    name: dependencies (${{ matrix.variant }})
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        variant: [registry, restored-store]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - id: store
        if: matrix.variant == 'restored-store'
        run: printf 'path=%s\n' "$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - id: cache
        name: Restore the seeded pnpm store
        if: matrix.variant == 'restored-store'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-benchmark-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Install tools
        run: pnpm run spec:setup
