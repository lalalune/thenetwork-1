name: Formal cache full check benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-cache-full-check-${{ github.ref }}
  cancel-in-progress: true

env:
  SURPLUS_API_KEY: ""
  OPENAI_API_KEY: ""
  BLOOIO_API_KEY: ""
  TWILIO_AUTH_TOKEN: ""
  CLOUDFLARE_API_TOKEN: ""
  NTWRK_ALLOW_DEPLOY: ""
  REQUIRE_PG: "1"

jobs:
  full-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1
        with:
          dafny-version: '4.11.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run spec:setup
      - name: Run Network formal validation from an empty cache
        run: /usr/bin/time -p pnpm run check --json | tee formal-check.jsonl
      - name: Print stage counts
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync } from "node:fs";
          const path = "formal-check.jsonl";
          if (!existsSync(path)) process.exit(0);
          const stages = {};
          for (const line of readFileSync(path, "utf8").trimEnd().split("\n")) {
            if (!line.startsWith("{")) continue;
            const row = JSON.parse(line);
            if (!row.stage) continue;
            const stage = (stages[row.stage] ??= { pass: 0, fail: 0 });
            stage[row.ok ? "pass" : "fail"]++;
            if (!row.ok) console.log(row.stage, row.summary);
          }
          console.log(JSON.stringify(stages, null, 2));
          JS
