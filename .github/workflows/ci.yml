name: Formal cache scope qualification
on:
  push:
    branches: [codex/qualify-formal-cache-scope-base-595]
  pull_request:
    branches: [codex/qualify-formal-cache-scope-base-595]
permissions:
  contents: read
jobs:
  push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: mkdir -p probe && echo full > probe/marker
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: probe
          key: scope-595-v1-full-seed
  pull_request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: mkdir -p probe && echo generation > probe/marker
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: probe
          key: scope-595-v1-generation-seed
      - run: rm -f probe/marker
      - id: old
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: probe
          key: scope-595-v1-full-head
          restore-keys: |
            scope-595-v1-full-
            scope-595-v1-generation-
      - run: test "$(cat probe/marker)" = generation
      - run: rm -f probe/marker
      - id: full
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: probe
          key: scope-595-v1-full-head
          restore-keys: |
            scope-595-v1-full-
      - run: test "$(cat probe/marker)" = full
      - name: Production fallback is skipped after a prefix hit
        if: ${{ !steps.full.outputs.cache-matched-key }}
        run: exit 1
      - run: rm -f probe/marker
      - id: absent
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: probe
          key: scope-595-v1-absent-head
          restore-keys: |
            scope-595-v1-absent-
      - run: rm -f probe/marker
      - id: generation
        if: ${{ !steps.absent.outputs.cache-matched-key }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: probe
          key: scope-595-v1-generation-head
          restore-keys: |
            scope-595-v1-generation-
      - run: test "$(cat probe/marker)" = generation
# This revision seeds the pull request cache scope.
