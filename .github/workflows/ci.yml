{
  "name": "Formal tool archive scope test",
  "on": {
    "push": {
      "branches": [
        "codex/probe-formal-tool-archive-base"
      ]
    },
    "pull_request": {
      "branches": [
        "codex/probe-formal-tool-archive-base"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "seed": {
      "if": "${{ github.event_name == 'push' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "strategy": {
        "fail-fast": false,
        "max-parallel": 3,
        "matrix": {
          "include": [
            {
              "group": "current",
              "prefix": "complete",
              "marker": "base-current"
            },
            {
              "group": "action",
              "prefix": "complete",
              "marker": "old-action"
            },
            {
              "group": "run",
              "prefix": "complete",
              "marker": "old-run"
            },
            {
              "group": "simulator",
              "prefix": "complete",
              "marker": "old-simulator"
            },
            {
              "group": "migration",
              "prefix": "complete_v2",
              "marker": "old-v2"
            },
            {
              "group": "retry",
              "prefix": "complete",
              "marker": "base-retry"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Identify formal action archives",
          "id": "formal-keys",
          "shell": "bash",
          "env": {
            "TOOLS": "probe-tool-scope-20261123-${{ matrix.group }}",
            "ACTION_TOOLS": "${{ hashFiles('tools/vibestack/vibestack/action.ts', 'tools/vibestack/vibestack/run.ts', 'tools/vibestack/vibestack/simulator.ts') }}",
            "RESTORE": "true"
          },
          "run": "printf '%s\\n' \"restore=$RESTORE\" \"complete=formal-full-complete-v3-$TOOLS-$ACTION_TOOLS-\" \\\n  \"previous=formal-full-complete-v3-$TOOLS-\" \"complete_v2=formal-full-complete-v2-$TOOLS-\" \\\n  \"checkpoint=formal-full-checkpoint-v2-$TOOLS-\" \"legacy=formal-full-actions-v1-$TOOLS-\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "run": "mkdir -p .spec-cache/formal\nprintf \"%s\\n\" \"${{ matrix.marker }}\" > .spec-cache/formal/action-111111111111111111111111.json.gz"
        },
        {
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "${{ matrix.prefix == 'complete' && steps.formal-keys.outputs.complete || steps.formal-keys.outputs.complete_v2 }}base-1"
          }
        }
      ]
    },
    "probe": {
      "if": "${{ github.event_name == 'pull_request' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 4,
      "name": "${{ matrix.case }}",
      "strategy": {
        "fail-fast": false,
        "max-parallel": 3,
        "matrix": {
          "include": [
            {
              "case": "qualified-base-beats-pr-stale",
              "group": "current",
              "attempt": "1",
              "mutation": "",
              "marker": "base-current",
              "winner": "formal-complete",
              "shard": "",
              "pr_seed": "pr-previous",
              "cold": false,
              "save": "skipped"
            },
            {
              "case": "action-change",
              "group": "action",
              "attempt": "1",
              "mutation": "action",
              "marker": "old-action",
              "winner": "formal-previous",
              "shard": "true",
              "pr_seed": "",
              "cold": false,
              "save": "success"
            },
            {
              "case": "run-change",
              "group": "run",
              "attempt": "1",
              "mutation": "run",
              "marker": "old-run",
              "winner": "formal-previous",
              "shard": "true",
              "pr_seed": "",
              "cold": false,
              "save": "success"
            },
            {
              "case": "simulator-change",
              "group": "simulator",
              "attempt": "1",
              "mutation": "simulator",
              "marker": "old-simulator",
              "winner": "formal-previous",
              "shard": "true",
              "pr_seed": "",
              "cold": false,
              "save": "success"
            },
            {
              "case": "migrate-v2-base-beats-pr-legacy",
              "group": "migration",
              "attempt": "1",
              "mutation": "",
              "marker": "old-v2",
              "winner": "formal-previous",
              "shard": "true",
              "pr_seed": "pr-legacy",
              "cold": false,
              "save": "success"
            },
            {
              "case": "resume-own-checkpoint",
              "group": "retry",
              "attempt": "2",
              "mutation": "",
              "marker": "same-retry",
              "winner": "formal-retry",
              "shard": "",
              "pr_seed": "pr-retry",
              "cold": false,
              "save": "success"
            },
            {
              "case": "unrelated-checkpoint-still-shards",
              "group": "checkpoint",
              "attempt": "1",
              "mutation": "",
              "marker": "unrelated",
              "winner": "formal-checkpoint",
              "shard": "true",
              "pr_seed": "pr-unrelated",
              "cold": false,
              "save": "success"
            },
            {
              "case": "missing-starts-shards",
              "group": "missing",
              "attempt": "1",
              "mutation": "",
              "marker": "empty",
              "winner": "none",
              "shard": "true",
              "pr_seed": "",
              "cold": false,
              "save": "skipped"
            },
            {
              "case": "explicit-cold-ignores-archive",
              "group": "current",
              "attempt": "4",
              "mutation": "",
              "marker": "empty",
              "winner": "none",
              "shard": "true",
              "pr_seed": "",
              "cold": true,
              "save": "skipped"
            }
          ]
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Prepare a cold or changed tool case",
          "env": {
            "MUTATION": "${{ matrix.mutation }}"
          },
          "shell": "bash",
          "run": "\nif [[ -n \"$MUTATION\" ]]; then\n  printf '\\nexport const syntheticArchiveKeyMutation = 1;\\n' >> \"tools/vibestack/vibestack/$MUTATION.ts\"\nfi\n"
        },
        {
          "name": "Identify formal action archives",
          "id": "formal-keys",
          "shell": "bash",
          "env": {
            "TOOLS": "probe-tool-scope-20261123-${{ matrix.group }}",
            "ACTION_TOOLS": "${{ hashFiles('tools/vibestack/vibestack/action.ts', 'tools/vibestack/vibestack/run.ts', 'tools/vibestack/vibestack/simulator.ts') }}",
            "RESTORE": "${{ !matrix.cold }}"
          },
          "run": "printf '%s\\n' \"restore=$RESTORE\" \"complete=formal-full-complete-v3-$TOOLS-$ACTION_TOOLS-\" \\\n  \"previous=formal-full-complete-v3-$TOOLS-\" \"complete_v2=formal-full-complete-v2-$TOOLS-\" \\\n  \"checkpoint=formal-full-checkpoint-v2-$TOOLS-\" \"legacy=formal-full-actions-v1-$TOOLS-\" >> \"$GITHUB_OUTPUT\"\n"
        },
        {
          "if": "${{ matrix.pr_seed != '' }}",
          "run": "mkdir -p .spec-cache/formal\nprintf \"%s\\n\" \"${{ matrix.pr_seed == 'pr-retry' && 'same-retry' || matrix.pr_seed == 'pr-unrelated' && 'unrelated' || 'pr-stale' }}\" > .spec-cache/formal/action-111111111111111111111111.json.gz"
        },
        {
          "if": "${{ matrix.pr_seed != '' }}",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "${{ matrix.pr_seed == 'pr-previous' && format('{0}other-stale-2', steps.formal-keys.outputs.previous) || matrix.pr_seed == 'pr-legacy' && format('{0}pr-legacy-1', steps.formal-keys.outputs.legacy) || matrix.pr_seed == 'pr-retry' && format('{0}{1}-1', steps.formal-keys.outputs.checkpoint, github.run_id) || format('{0}unrelated-1', steps.formal-keys.outputs.checkpoint) }}"
          }
        },
        {
          "run": "rm -f .spec-cache/formal/action-111111111111111111111111.json.gz"
        },
        {
          "name": "Restore a previous attempt of this full check",
          "id": "formal-retry",
          "if": "steps.formal-keys.outputs.restore == 'true' && matrix.attempt != '1'",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "lookup-only": "${{ github.job == 'generation' }}",
            "key": "${{ steps.formal-keys.outputs.complete }}${{ github.run_id }}-${{ matrix.attempt }}",
            "restore-keys": "${{ steps.formal-keys.outputs.complete }}${{ github.run_id }}-\n${{ steps.formal-keys.outputs.checkpoint }}${{ github.run_id }}-\n"
          }
        },
        {
          "name": "Restore actions from a successful full check",
          "id": "formal-complete",
          "if": "steps.formal-keys.outputs.restore == 'true' && !steps.formal-retry.outputs.cache-matched-key",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "lookup-only": "${{ github.job == 'generation' }}",
            "key": "${{ steps.formal-keys.outputs.complete }}${{ github.run_id }}-${{ matrix.attempt }}",
            "restore-keys": "${{ steps.formal-keys.outputs.complete }}"
          }
        },
        {
          "name": "Restore reusable actions from an earlier full check",
          "id": "formal-previous",
          "if": "steps.formal-keys.outputs.restore == 'true' && !steps.formal-retry.outputs.cache-matched-key && !steps.formal-complete.outputs.cache-matched-key",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "${{ steps.formal-keys.outputs.complete }}${{ github.run_id }}-${{ matrix.attempt }}",
            "restore-keys": "${{ steps.formal-keys.outputs.previous }}\n${{ steps.formal-keys.outputs.complete_v2 }}\n"
          }
        },
        {
          "name": "Restore checkpoint or legacy formal actions",
          "id": "formal-checkpoint",
          "if": "steps.formal-keys.outputs.restore == 'true' && !steps.formal-retry.outputs.cache-matched-key && !steps.formal-complete.outputs.cache-matched-key && !steps.formal-previous.outputs.cache-matched-key",
          "uses": "actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "${{ steps.formal-keys.outputs.checkpoint }}${{ github.run_id }}-${{ matrix.attempt }}",
            "restore-keys": "${{ steps.formal-keys.outputs.checkpoint }}\n${{ steps.formal-keys.outputs.legacy }}\n"
          }
        },
        {
          "name": "Determine whether to precompute formal actions",
          "id": "shards",
          "shell": "bash",
          "env": {
            "ENABLED": "true",
            "COLD": "${{ matrix.cold }}",
            "MATCHED": "${{ steps.formal-retry.outputs.cache-matched-key || steps.formal-complete.outputs.cache-matched-key }}"
          },
          "run": "if [[ \"$ENABLED\" == true && ( \"$COLD\" == true || -z \"$MATCHED\" ) ]]; then\n  echo 'enabled=true' >> \"$GITHUB_OUTPUT\"\nfi\n"
        },
        {
          "name": "Start the full verification deadline",
          "env": {
            "COLD": "${{ matrix.cold }}"
          },
          "shell": "bash",
          "run": "mkdir -p .spec-cache/formal\nif [[ \"$COLD\" == true ]]; then\n  test -z \"$(find .spec-cache/formal -mindepth 1 -maxdepth 1 -print -quit)\"\nfi\nfind .spec-cache/formal -maxdepth 1 -type f -name 'action-*.json.gz' -printf '%f\\n' |\n  sort > \"$RUNNER_TEMP/formal-actions-before\"\necho \"FORMAL_DEADLINE=$(( $(date +%s) + 1620 ))\" >> \"$GITHUB_ENV\"\n"
        },
        {
          "name": "Run the full Vibestack check",
          "id": "check",
          "shell": "bash",
          "run": "true\n"
        },
        {
          "name": "Prepare completed actions for upload",
          "if": "${{ !cancelled() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') }}",
          "id": "ready",
          "shell": "bash",
          "run": "# The toolkit publishes complete raw actions by atomic rename in this directory.\nfind .spec-cache/formal -mindepth 1 -maxdepth 1 -regextype posix-extended \\\n  ! \\( -type f -regex '.*/action-[a-f0-9]{24}\\.json\\.gz' \\) -exec rm -rf -- {} +\nfind .spec-cache/formal -maxdepth 1 -type f -printf '%f\\n' |\n  sort > \"$RUNNER_TEMP/formal-actions-after\"\nif [[ -s \"$RUNNER_TEMP/formal-actions-after\" ]]; then\n  echo \"nonempty=true\" >> \"$GITHUB_OUTPUT\"\nfi\nif [[ -n \"$(comm -13 \"$RUNNER_TEMP/formal-actions-before\" \"$RUNNER_TEMP/formal-actions-after\")\" ]]; then\n  echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\nfi\n"
        },
        {
          "name": "Save actions from a successful full check",
          "if": "!cancelled() && steps.check.outcome == 'success' && steps.ready.outputs.nonempty == 'true' && (steps.ready.outputs.changed == 'true' || !startsWith(steps.formal-retry.outputs.cache-matched-key || steps.formal-complete.outputs.cache-matched-key, steps.formal-keys.outputs.complete))",
          "uses": "actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830",
          "with": {
            "path": ".spec-cache/formal",
            "key": "${{ steps.formal-keys.outputs.complete }}${{ github.run_id }}-${{ matrix.attempt }}"
          },
          "id": "save-complete"
        },
        {
          "name": "Assert selected archive and sharding",
          "shell": "bash",
          "env": {
            "EXPECT_MARKER": "${{ matrix.marker }}",
            "EXPECT_WINNER": "${{ matrix.winner }}",
            "EXPECT_SHARD": "${{ matrix.shard }}",
            "EXPECT_SAVE": "${{ matrix.save }}",
            "SHARD": "${{ steps.shards.outputs.enabled }}",
            "FORMAL_RETRY": "${{ steps.formal-retry.outputs.cache-matched-key }}",
            "FORMAL_COMPLETE": "${{ steps.formal-complete.outputs.cache-matched-key }}",
            "FORMAL_PREVIOUS": "${{ steps.formal-previous.outputs.cache-matched-key }}",
            "FORMAL_CHECKPOINT": "${{ steps.formal-checkpoint.outputs.cache-matched-key }}",
            "SAVED": "${{ steps.save-complete.outcome }}"
          },
          "run": "\nf=.spec-cache/formal/action-111111111111111111111111.json.gz\nif [[ -f \"$f\" ]]; then marker=\"$(cat \"$f\")\"; else marker=empty; fi\n[[ \"$marker\" == \"$EXPECT_MARKER\" ]]\n[[ \"$SHARD\" == \"$EXPECT_SHARD\" ]]\nwinners=()\n[[ -z \"$FORMAL_RETRY\" ]] || winners+=(formal-retry)\n[[ -z \"$FORMAL_COMPLETE\" ]] || winners+=(formal-complete)\n[[ -z \"$FORMAL_PREVIOUS\" ]] || winners+=(formal-previous)\n[[ -z \"$FORMAL_CHECKPOINT\" ]] || winners+=(formal-checkpoint)\nif [[ \"$EXPECT_WINNER\" == none ]]; then\n  [[ ${#winners[@]} == 0 ]]\nelse\n  [[ ${#winners[@]} == 1 && ${winners[0]} == \"$EXPECT_WINNER\" ]]\nfi\n[[ \"$SAVED\" == \"$EXPECT_SAVE\" ]]\nprintf 'restore=%s shards=%s save=%s\\n' \"$EXPECT_WINNER\" \"$SHARD\" \"$SAVED\"\n"
        }
      ]
    }
  }
}
