# CI: install, typecheck, `pnpm run sim` (the simulations and their gates, with a real Postgres so the
# pipeline, safety, ops and audit Postgres gates block), the plugin build check and the sites production build; plus the integration and e2e suites (security suite included) with a
# real Postgres. Validation policy: simulations + integration + e2e, no unit or smoke tests
# (docs/tests-policy.md). No
# secrets are given to CI, and LIVE_TESTS is never set, so no paid LLM call, Blooio or Twilio call,
# or Cloudflare deploy can happen here. Deploys live in deploy-sites.yml. Actions and the Postgres image are pinned by digest.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Blank every provider key and leave LIVE_TESTS unset: live tests skip themselves.
  SURPLUS_API_KEY: ""
  OPENAI_API_KEY: ""
  BLOOIO_API_KEY: ""
  BLOOIO_LIVE_TEST: ""
  TWILIO_AUTH_TOKEN: ""
  TURNSTILE_SECRET_KEY: ""
  CLOUDFLARE_API_TOKEN: ""
  NTWRK_ALLOW_DEPLOY: ""
  LLM_ALLOW_OPENAI_FALLBACK: ""
  # Any accidental LLM call fails fast instead of hanging.
  LLM_TIMEOUT_MS: "10000"
  LLM_MAX_RETRIES: "0"

jobs:
  offline-core:
    # "offline" means no network calls and no secrets. The simulations get the same pinned Postgres as
    # the integration job, so the Postgres blocks (pipeline, pipeline-slop, safety, ops, audit) run and block.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - name: Put the Postgres client tools on PATH
        # The simulations call pg_isready, pg_ctl, pg_dump and psql (dev-pg.ts, the ops backup drill).
        run: |
          bin="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -x "$bin/pg_ctl"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Install
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Install the toolkit (tools/vibestack)
        run: pnpm run spec:setup
        timeout-minutes: 5
      - name: Require Postgres
        run: |
          pg_isready -h localhost -p 54339
          node --import tsx scripts/require-pg.ts
      - name: Generate design and connector CSS
        run: pnpm run connector:css
        timeout-minutes: 5
      - name: Restore TypeScript incremental state
        id: type-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/typecheck
          key: typecheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'tsconfig.json', 'sites/tsconfig.json') }}-${{ github.sha }}
          restore-keys: typecheck-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'tsconfig.json', 'sites/tsconfig.json') }}-
      - name: Typecheck (packages, deploy, tests, scripts/sim)
        run: pnpm exec tsc --noEmit -p .
        timeout-minutes: 5
      - name: Typecheck (sites, scripts)
        run: pnpm exec tsc --noEmit -p sites/tsconfig.json
        timeout-minutes: 5
      - name: Save TypeScript incremental state
        if: steps.type-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/typecheck
          key: ${{ steps.type-cache.outputs.cache-primary-key }}
      - name: Simulations other than matching
        # Run the in-memory NYC world alongside the other blocks on the same runner.
        shell: bash
        run: |
          if [ -n "${LIVE_TESTS:-}" ]; then echo "LIVE_TESTS must be unset in CI"; exit 1; fi
          (pnpm run sim --only network | sed -u 's/^/[network] /') &
          network_pid=$!
          core_status=0
          pnpm run sim --skip matching,network --json sim-gates.json || core_status=$?
          network_status=0
          wait "$network_pid" || network_status=$?
          if (( core_status || network_status )); then
            echo "Simulation failure (core=$core_status, network=$network_status)"
            exit 1
          fi
        timeout-minutes: 30
      - name: No Postgres gate was skipped
        # A Postgres block that cannot reach Postgres records a tracked "skipped" gate. With REQUIRE_PG=1
        # that is a failure.
        run: |
          skipped="$(jq -r '.gates[] | select((.blocking | not) and (.block | IN("pipeline", "pipeline-slop", "safety", "ops", "audit")) and (((.name + " " + (.detail // "")) | test("skipped"; "i")))) | "[\(.block)] \(.name)"' sim-gates.json)"
          if [ -n "$skipped" ]; then echo "Postgres gates skipped with REQUIRE_PG=1:"; echo "$skipped"; exit 1; fi
      - name: Plugin packages match their sources (OpenAI and Claude manifests, SKILL.md snapshots)
        run: node --import tsx plugins/build.ts --check
      - name: The retired domain is gone (the hub is ntwrk.party; the old domain only redirects)
        run: |
          if git grep -n -I -E 'ntwrk[.]love' -- .; then echo "use ntwrk.party / api.ntwrk.party instead"; exit 1; fi
      - name: Production build of the four sites (refuses draft legal text and unfilled placeholders)
        run: pnpm run sites:build
        env:
          DEPLOY_TARGET: production
