name: Filtered toolkit setup benchmark
on: workflow_dispatch
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install only browser runtime dependencies
        run: pnpm --dir tools/vibestack --filter vibestack --prod install --frozen-lockfile --ignore-scripts
      - name: Install pinned Chromium for Bombadil
        working-directory: tools/vibestack
        shell: bash
        run: |
          pnpm exec playwright install --no-shell chromium
          launch() {
            node --input-type=module -e '
              import { chromium } from "playwright";
              const browser = await chromium.launch({ executablePath: chromium.executablePath(), timeout: 10000 });
              await browser.close();
            '
          }
          if ! launch; then
            pnpm exec playwright install-deps chromium
            launch
          fi
      - run: pnpm run spec:explore
  checks:
    # The design system and the component library: the brand tokens agree with design.md, the generated stories
    # are current, the stories pass in happy-dom, and ESLint (tokens-only styling) passes with no warnings.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
      - name: Install the toolkit (tools/vibestack)
        run: pnpm --dir tools/vibestack --filter vibestack install --frozen-lockfile --ignore-scripts
        timeout-minutes: 5
      - name: Typecheck both CI projects using the same filtered toolkit install
        run: |
          pnpm run connector:css
          pnpm exec tsc --noEmit -p .
          pnpm exec tsc --noEmit -p sites/tsconfig.json
      - name: Design tokens agree with design.md (design:check)
        run: pnpm run design:check
      - name: Design-system CSS (design:build)
        run: pnpm run design:build
      - name: Generated stories are current (ui:gen, --check)
        run: pnpm run ui:gen
      - name: Component stories (ui:test)
        run: pnpm run ui:test
        timeout-minutes: 10
      - name: ESLint for packages/ui, apps and the console and connector pages (lint:ui)
        run: pnpm run lint:ui
