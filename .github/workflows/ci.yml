name: Network cold two-shard qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulations:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the exact source under qualification
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 939438ce12e4e5cb156a0de22ac221b5384edb0b
          diff -u <(printf '%s\n' .github/workflows/ci.yml scripts/formal-shard-artifacts.py scripts/formal-shard-weights.json scripts/precompute-formal-shard.ts scripts/profile-formal-tools.mjs) <(git diff --name-only HEAD^ HEAD)
          mkdir -p .spec-cache/formal
          test -z "$(find .spec-cache/formal -mindepth 1 -maxdepth 1 -print -quit)"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: corepack pnpm@10.24.0 --filter vibestack install --frozen-lockfile --ignore-scripts
        working-directory: tools/vibestack
      - name: Install the pinned Quint Rust evaluator
        # Use the published asset directly so GitHub API rate limits cannot block setup.
        working-directory: tools/vibestack
        shell: bash
        run: |
          version="$(node -p 'require("@informalsystems/quint/dist/src/rust/binaryManager.js").QUINT_EVALUATOR_VERSION')"
          test "$version" = v0.7.1
          directory="$(node -p 'require("@informalsystems/quint/dist/src/config.js").rustEvaluatorDir("v0.7.1")')"
          archive="$RUNNER_TEMP/quint-evaluator.tar.gz"
          curl --fail --silent --show-error --location --retry 4 \
            "https://github.com/quint-co/quint/releases/download/evaluator/$version/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' ce0502bdef65dc26c242a9e56379a9bb26de6f3db38f0e3989339d46a542f5eb "$archive" | sha256sum --check
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory" quint_evaluator
          test -x "$directory/quint_evaluator"
      - name: Precompute the assigned models from the empty cache
        env:
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/profile-formal-tools.mjs"
          export VIBESTACK_TOOL_TIMINGS="$RUNNER_TEMP/formal-timing.jsonl"
          node scripts/precompute-formal-shard.ts "$SHARD" 2
      - name: Stage source-bound formal actions
        env:
          SHARD: ${{ matrix.shard }}
        run: python3 scripts/formal-shard-artifacts.py stage "$SHARD" "$RUNNER_TEMP/formal-shard"
      - name: Upload formal actions for this attempt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-raw-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/formal-shard/
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
      - name: Retain shard timing data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-timing-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/formal-timing.jsonl
          if-no-files-found: ignore
          retention-days: 2
  full-check:
    needs: simulations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REQUIRE_PG: "1"
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the exact source under qualification
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 939438ce12e4e5cb156a0de22ac221b5384edb0b
          diff -u <(printf '%s\n' .github/workflows/ci.yml scripts/formal-shard-artifacts.py scripts/formal-shard-weights.json scripts/precompute-formal-shard.ts scripts/profile-formal-tools.mjs) <(git diff --name-only HEAD^ HEAD)
          mkdir -p .spec-cache/formal
          test -z "$(find .spec-cache/formal -mindepth 1 -maxdepth 1 -print -quit)"
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1
        with:
          dafny-version: '4.11.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run spec:setup
      - name: Install the pinned Quint Rust evaluator
        # Use the published asset directly so GitHub API rate limits cannot block setup.
        working-directory: tools/vibestack
        shell: bash
        run: |
          version="$(node -p 'require("@informalsystems/quint/dist/src/rust/binaryManager.js").QUINT_EVALUATOR_VERSION')"
          test "$version" = v0.7.1
          directory="$(node -p 'require("@informalsystems/quint/dist/src/config.js").rustEvaluatorDir("v0.7.1")')"
          archive="$RUNNER_TEMP/quint-evaluator.tar.gz"
          curl --fail --silent --show-error --location --retry 4 \
            "https://github.com/quint-co/quint/releases/download/evaluator/$version/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' ce0502bdef65dc26c242a9e56379a9bb26de6f3db38f0e3989339d46a542f5eb "$archive" | sha256sum --check
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory" quint_evaluator
          test -x "$directory/quint_evaluator"
      - name: Require the synthetic Postgres service
        run: |
          bin="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -x "$bin/pg_ctl"
          export PATH="$bin:$PATH"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/pg_isready" -h localhost -p 54339
          node --import tsx scripts/require-pg.ts
      - name: Download only the current attempt's actions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: formal-raw-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/formal-artifacts
      - name: Validate both manifests and combine the action keys
        run: python3 scripts/formal-shard-artifacts.py restore "$RUNNER_TEMP/formal-artifacts"
      - name: Run the full Vibestack check
        shell: bash
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/profile-formal-tools.mjs"
          export VIBESTACK_TOOL_TIMINGS="$RUNNER_TEMP/formal-timing.jsonl"
          timeout --kill-after=15s 27m pnpm run check
      - name: Retain final timing data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-timing-${{ github.run_attempt }}-full
          path: ${{ runner.temp }}/formal-timing.jsonl
          if-no-files-found: ignore
          retention-days: 2
