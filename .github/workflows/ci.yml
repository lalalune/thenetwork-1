name: Network formal accept qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      REQUIRE_PG: "1"
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1
        with:
          dafny-version: '4.11.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run spec:setup
      - name: Install the pinned Quint Rust evaluator
        # Use the published asset directly so GitHub API rate limits cannot block setup.
        working-directory: tools/vibestack
        shell: bash
        run: |
          version="$(node -p 'require("@informalsystems/quint/dist/src/rust/binaryManager.js").QUINT_EVALUATOR_VERSION')"
          test "$version" = v0.7.1
          directory="$(node -p 'require("@informalsystems/quint/dist/src/config.js").rustEvaluatorDir("v0.7.1")')"
          archive="$RUNNER_TEMP/quint-evaluator.tar.gz"
          curl --fail --silent --show-error --location --retry 4 \
            "https://github.com/quint-co/quint/releases/download/evaluator/$version/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' ce0502bdef65dc26c242a9e56379a9bb26de6f3db38f0e3989339d46a542f5eb "$archive" | sha256sum --check
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory" quint_evaluator
          test -x "$directory/quint_evaluator"
      - name: Require the synthetic Postgres service
        run: |
          bin="$(find /usr/lib/postgresql -mindepth 2 -maxdepth 2 -type d -name bin | sort -V | tail -n 1)"
          test -x "$bin/pg_ctl"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/pg_isready" -h localhost -p 54339
          node --import tsx scripts/require-pg.ts
      - name: Run every formal verification stage
        shell: bash
        run: |
          export NODE_OPTIONS="--import=$GITHUB_WORKSPACE/scripts/profile-formal-tools.mjs"
          export VIBESTACK_TOOL_TIMINGS="$RUNNER_TEMP/formal-timing.jsonl"
          timeout --kill-after=20s 100m pnpm run accept
      - name: Verify that acceptance wrote only the review ledger
        run: |
          git diff --exit-code -- . ':(exclude)spec/lock.json'
          git diff --quiet -- spec/lock.json && exit 1
          mkdir -p "$RUNNER_TEMP/accepted"
          cp spec/lock.json "$RUNNER_TEMP/accepted/"
          git rev-parse HEAD > "$RUNNER_TEMP/accepted/source.txt"
          git diff --stat -- spec/lock.json
      - name: Retain approved ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reviewed-formal-ledger
          path: ${{ runner.temp }}/accepted/
          if-no-files-found: error
          retention-days: 2
      - name: Summarize formal tool timings
        if: ${{ !cancelled() }}
        run: |
          if [[ -s "$RUNNER_TEMP/formal-timing.jsonl" ]]; then
            python3 scripts/summarize-formal-tools.py "$RUNNER_TEMP/formal-timing.jsonl"
          fi
      - name: Retain timing data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-tool-timing
          path: ${{ runner.temp }}/formal-timing.jsonl
          if-no-files-found: ignore
          retention-days: 2
