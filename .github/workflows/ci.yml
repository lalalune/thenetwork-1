name: Formal timeout cache pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    if: github.repository == 'lalalune/thenetwork-1' && startsWith(github.ref, 'refs/heads/codex/formal-timeout-pilot-')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      digest: ${{ steps.export.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm run spec:setup
      - name: Run real Quint action then wait for GNU timeout
        id: check
        shell: bash
        run: |
          status=0
          timeout --signal=TERM --kill-after=3s 12s node scripts/formal-timeout-pilot.mts produce || status=$?
          printf 'code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          echo "GNU timeout exit status: $status"
          exit "$status"
      - name: Export completed raw action
        id: export
        if: always() && steps.check.outputs.code == '124'
        run: node scripts/formal-timeout-pilot.mts export
      - name: Publish immutable raw action cache
        if: always() && steps.export.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/formal-timeout-pilot
          key: formal-timeout-pilot-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

  consumer:
    needs: producer
    if: always() && needs.producer.result == 'failure' && needs.producer.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm run spec:setup
      - name: Restore exact pilot cache from failed producer
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/formal-timeout-pilot
          key: formal-timeout-pilot-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          fail-on-cache-miss: true
      - name: Verify byte-identical reuse on a new runner
        env:
          EXPECTED_DIGEST: ${{ needs.producer.outputs.digest }}
        run: node scripts/formal-timeout-pilot.mts consume "$EXPECTED_DIGEST"
