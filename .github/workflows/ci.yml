name: Cold formal CPU sampler
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: vibestack-full-check-${{ github.ref }}
      cancel-in-progress: false
    env:
      REQUIRE_PG: "1"
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_USER: runner
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54339:5432
        options: >-
          --health-cmd "pg_isready -U runner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dafny-lang/setup-dafny-action@be023fc606339d46ed6b077dcb8614d0279ded31 # v1
        with:
          dafny-version: '4.11.0'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run spec:setup
      - name: Install the pinned Quint Rust evaluator
        # Use the published asset directly so GitHub API rate limits cannot block setup.
        working-directory: tools/vibestack
        shell: bash
        run: |
          version="$(node -p 'require("@informalsystems/quint/dist/src/rust/binaryManager.js").QUINT_EVALUATOR_VERSION')"
          test "$version" = v0.7.1
          directory="$(node -p 'require("@informalsystems/quint/dist/src/config.js").rustEvaluatorDir("v0.7.1")')"
          archive="$RUNNER_TEMP/quint-evaluator.tar.gz"
          curl --fail --silent --show-error --location --retry 4 \
            "https://github.com/quint-co/quint/releases/download/evaluator/$version/quint_evaluator-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' ce0502bdef65dc26c242a9e56379a9bb26de6f3db38f0e3989339d46a542f5eb "$archive" | sha256sum --check
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory" quint_evaluator
          test -x "$directory/quint_evaluator"
      - name: Measure 10 minutes of a cold full formal check
        shell: bash
        run: |
          mkdir -p .spec-cache/formal
          nproc
          free -m
          (
            while sleep 25; do
              echo "FORMAL_PROFILE $(date -u +%FT%TZ) $(find .spec-cache/formal -maxdepth 1 -type f -name 'action-*.json.gz' | wc -l) completed raw actions"
              python3 -c 'from pathlib import Path
          import os
          for process_dir in Path("/proc").glob("[0-9]*"):
              try:
                  cwd = os.readlink(process_dir / "cwd")
                  if "/thenetwork-vibestack-" not in cwd or "/gen/" not in cwd:
                      continue
                  stat = (process_dir / "stat").read_text()
                  command = stat.split(")", 1)[0].split("(", 1)[1]
                  if "node" not in command and "quint" not in command and "dafny" not in command and "z3" not in command:
                      continue
                  fields = stat.split(")", 1)[1].split()
                  cpu = (int(fields[11]) + int(fields[12])) / os.sysconf("SC_CLK_TCK")
                  print(f"{command} {cpu:.2f}s {cwd.split(chr(47) + "gen" + chr(47), 1)[-1]}")
              except (OSError, ValueError, IndexError):
                  pass'
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          timeout --kill-after=15s 10m pnpm run check --json
