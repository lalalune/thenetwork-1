name: Shared matching runner benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SURPLUS_API_KEY: ""
  OPENAI_API_KEY: ""
  CLOUDFLARE_AI_TOKEN: ""
  LIVE_TESTS: ""

jobs:
  matching:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run all pack gates concurrently
        shell: bash
        run: |
          nproc
          free -m
          packs=(ntwrk slop peon friends)
          pids=()
          for pack in "${packs[@]}"; do
            ( /usr/bin/time -f "RESOURCE elapsed=%e user=%U sys=%S rss_kib=%M" pnpm run sim --only matching --matching-pack "$pack" ) 2>&1 | sed -u "s/^/[$pack] /" &
            pids+=("$!")
          done
          failed=0
          for index in "${!pids[@]}"; do
            if wait "${pids[$index]}"; then
              echo "${packs[$index]} passed"
            else
              echo "${packs[$index]} failed"
              failed=1
            fi
          done
          exit "$failed"
        timeout-minutes: 32
