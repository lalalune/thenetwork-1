name: Dependency store cache benchmark
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global corepack@0.35.0 && corepack enable pnpm && pnpm --version
      - name: Fill stores from the two locked installs
        run: |
          pnpm install --frozen-lockfile --store-dir "$RUNNER_TEMP/root-store"
          pnpm --dir tools/vibestack --filter vibestack install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/tool-store"
          du -sh "$RUNNER_TEMP/"{root,tool}-store
      - name: Save root store
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/root-store
          key: root-store-probe-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save generation toolkit store
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/tool-store
          key: tool-store-probe-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - run: rm -rf "$RUNNER_TEMP/root-store" "$RUNNER_TEMP/tool-store"
      - name: Restore root store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/root-store
          key: root-store-probe-v1-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Restore generation toolkit store
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/tool-store
          key: tool-store-probe-v1-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Compare locked installs in alternating order
        run: |
          for project in root tool; do
            flags=()
            search_paths=(packages apps sites deploy)
            if [[ "$project" == tool ]]; then
              flags=(--dir tools/vibestack --filter vibestack)
              search_paths=(tools/vibestack)
            fi
            for sequence in cold,warm warm,cold cold,warm; do
              IFS=, read -r first second <<< "$sequence"
              for mode in "$first" "$second"; do
                find "${search_paths[@]}" -name node_modules -prune -exec rm -rf {} +
                if [[ "$project" == root ]]; then rm -rf node_modules; fi
                args=(--frozen-lockfile)
                if [[ "$project" == tool ]]; then args+=(--ignore-scripts); fi
                if [[ "$mode" == warm ]]; then
                  args+=(--offline --store-dir "$RUNNER_TEMP/$project-store")
                else
                  args+=(--store-dir "$(mktemp -d "$RUNNER_TEMP/$project-cold.XXXXXX")")
                fi
                /usr/bin/time -f "sample project=$project mode=$mode elapsed=%e user=%U sys=%S" \
                  pnpm "${flags[@]}" install "${args[@]}"
              done
            done
          done
